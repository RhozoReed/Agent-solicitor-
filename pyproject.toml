[project]
name = "agent-collecte"
version = "0.2.0"
description = "Agent de collecte de fonds avec workflow et interface de chat"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker", "apps/web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/worker/src", "."]
