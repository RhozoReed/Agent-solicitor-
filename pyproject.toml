[project]
name = "agent-collecte"
version = "0.1.0"
description = "Agent de collecte de fonds : e-mails de sollicitation personnalisés pour parrains et mécènes (Mistral Workflow)"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/worker/src"]
